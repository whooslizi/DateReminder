name: Build

on:
  push:
    branches: [ "eoleun" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "eoleun" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build app
      run: |
        xcodebuild -project DateReminder.xcodeproj -target DateReminder -configuration Release \
          SYMROOT="$PWD/build" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build

    - name: Package DMG
      run: hdiutil create -volname DateReminder -srcfolder build/Release/DateReminder.app -ov -format UDZO DateReminder.dmg

    - uses: actions/upload-artifact@v4
      with:
        name: DateReminder
        path: DateReminder.dmg

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" DateReminder.dmg --title "DateReminder $GITHUB_REF_NAME" --generate-notes
